ozon_mos_cutover:
  local_parity_gate: passed
  transport_removable: false
  requirements:
    - requirement: seller_roles_and_key_capabilities
      existing_capability: ozon.seller_roles.read
      status: local_verified
      gap: representative real-credential parity evidence
    - requirement: seller_account_identity
      existing_capability: ozon.seller_identity.read
      status: local_verified
      gap: real cabinet-binding evidence
    - requirement: warehouse_directory
      existing_capability: ozon.warehouses.read
      status: local_verified
      gap: real response and multi-page evidence
    - requirement: returns
      existing_capability: ozon.returns.read
      status: local_verified
      gap: representative real response evidence
    - requirement: fbs_unfulfilled
      existing_capability: ozon.fbs_unfulfilled.read
      status: local_verified
      gap: representative real response evidence
    - requirement: pagination_equivalence
      existing_capability: generic cursor, offset, and last_id continuation contract
      status: local_verified
      gap: representative real multi-page equivalence evidence
    - requirement: redacted_raw_response_contract
      existing_capability: lossless bounded normalization payload plus separate redacted evidence representation
      status: local_verified
      gap: representative real-payload normalization and redaction evidence

blockers:
  - blocker_id: P0-REAL-E2E-001
    summary: "No representative real-credential E2E PASS is recorded for Ozon cutover requirements, Wildberries, or Yandex Market."
    evidence: README.md
  - blocker_id: P0-RELEASE-001
    summary: "The deployed production revision, production smoke result, Remote MCP E2E, and rollback exercise are not evidenced in this repository."
    evidence: docker-compose.yml
  - blocker_id: P1-SECURITY-001
    summary: "PII redaction exists, but a marketplace-by-marketplace PII inventory and production evidence are incomplete."
    evidence: src/core/readPolicy.ts

v1_readiness:
  percent: 68
  method: "25 target controls: 15 complete including seven local Ozon parity controls, 4 half-credit partial, 6 missing; planning estimate, not release acceptance."
  next_milestone: "Run representative Ozon Real READ E2E for all seven cutover requirements and bind redacted evidence to the candidate commit and Manifest hash."

