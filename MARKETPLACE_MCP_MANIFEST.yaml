schema_version: "1.0"
mcp_version: "0.4.0"
production_commit: "0acd8026f0bf688f2cc6bca1e5f9633997117b51"
candidate_commit: "e0e105f08e2139d76df2e919d8d073563ef3e7c5"
production_commit_basis: "origin/main repository baseline; deployed revision is not evidenced"
production_mode: READ_ONLY
controlled_write_architecture: true
write_runtime_enabled: false
global_write_switch_allowed: false

supported_marketplaces:
  - ozon
  - wildberries
  - yandex_market

tool_surface:
  production_tools: 17
  candidate_tools: 32
  candidate_generic_read_tools_per_marketplace: 5
  assessment: "Compact legacy business tools plus generic allowlisted READ dispatch; do not add endpoint-per-tool wrappers."

integration_boundary:
  consumer: MOS
  boundary: CapabilityAdapter
  mcp_ownership: marketplace_access_and_execution
  mos_changes_required: false
  migration_strategy: incremental_capability_cutover
  persistent_full_catalog_allowed: false

security_guarantees:
  production_read_only_boundary: enforced
  candidate_read_only_boundary: enforced
  unknown_operations_denied_locally: true
  per_connection_permissions: true
  credentials_outside_tool_arguments: true
  credentials_encrypted_at_rest_in_postgres: true
  sensitive_response_redaction_default: true
  bounded_request_and_response_sizes: true
  rate_limit_and_retry_controls: true
  tool_call_audit: true
  destructive_operations_separate_risk_class: true

marketplaces:
  ozon:
    production_read: implemented
    candidate_extended_read: implemented_unverified
    representative_real_e2e: missing
    notes: "MOS cutover READ routes exist through generic dispatch, but permission binding, pagination parity, response-contract parity, and real-credential evidence remain open."
  wildberries:
    production_read: implemented
    candidate_extended_read: implemented_unverified
    representative_real_e2e: missing
    notes: "WB sandbox does not isolate Analytics/Common; stock checks may read the production account."
  yandex_market:
    production_read: implemented
    candidate_extended_read: implemented_unverified
    representative_real_e2e: missing
    notes: "deleteDocuments is DESTRUCTIVE and updateDocuments is WRITE; both are absent from the READ allowlist and covered by zero-transport regression tests."

