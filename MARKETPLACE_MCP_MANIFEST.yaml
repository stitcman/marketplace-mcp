ozon_mos_cutover:
  transport_removable: false
  requirements:
    - requirement: seller_roles_and_key_capabilities
      existing_capability: ozon.seller_roles.read
      status: implemented_unverified
      gap: real credential and permission parity evidence
    - requirement: seller_account_identity
      existing_capability: ozon.seller_identity.read
      status: implemented_unverified
      gap: cabinet binding and stable identity parity evidence
    - requirement: warehouse_directory
      existing_capability: ozon.warehouses.read
      status: implemented_unverified
      gap: warehouses.read provisioning and real response evidence
    - requirement: returns
      existing_capability: ozon.returns.read
      status: implemented_unverified
      gap: returns.read provisioning and representative real response evidence
    - requirement: fbs_unfulfilled
      existing_capability: ozon.fbs_unfulfilled.read
      status: implemented_unverified
      gap: representative real response evidence
    - requirement: pagination_equivalence
      existing_capability: generic bounded READ parameters and raw upstream paging fields
      status: candidate
      gap: no MOS-equivalence contract or multi-page parity test
    - requirement: redacted_raw_response_contract
      existing_capability: generic raw JSON dispatch plus conditional sensitive-field redaction
      status: candidate
      gap: no MOS normalization compatibility proof; Ozon sensitive-field classification and evidence redaction are incomplete

blockers:
  - blocker_id: P0-OZON-PARITY-001
    summary: "Ozon MOS cutover is blocked by permission provisioning for warehouse/returns reads, pagination equivalence, and a normalization-compatible redacted/raw response contract."
    evidence: docs/roadmap/MARKETPLACE_MCP_V1.md
  - blocker_id: P0-REAL-E2E-001
    summary: "No representative real-credential E2E PASS is recorded for Ozon cutover requirements, Wildberries, or Yandex Market."
    evidence: README.md
  - blocker_id: P0-RELEASE-001
    summary: "The deployed production revision, production smoke result, Remote MCP E2E, and rollback exercise are not evidenced in this repository."
    evidence: docker-compose.yml
  - blocker_id: P1-SECURITY-001
    summary: "PII redaction exists, but a marketplace-by-marketplace PII inventory and production evidence are incomplete."
    evidence: src/core/readPolicy.ts

v1_readiness:
  percent: 50
  method: "25 target controls after replacing one coarse Ozon control with seven MOS cutover controls: 8 complete, 9 half-credit implemented-unverified, 8 candidate/missing; planning estimate, not release acceptance."
  next_milestone: "Close Ozon permission, pagination, and response-contract gaps, then prove all seven cutover requirements with representative real credentials."

